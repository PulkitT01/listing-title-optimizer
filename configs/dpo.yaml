# Stage 2b: DPO on top of the merged SFT model (the SFT model is also the reference).
stage: dpo
model:
  base_model: Qwen/Qwen3-1.7B
  load_in_4bit: false
  lora_r: 16
  lora_alpha: 32
init_adapter: outputs/sft
train_file: data/preferences/dpo_train.jsonl
output_dir: outputs/dpo
learning_rate: 2.0e-5
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_length: 1024
beta: 0.1
logging_steps: 10
save_steps: 500
report_to: none
seed: 42
