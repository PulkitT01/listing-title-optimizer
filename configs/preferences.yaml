# Stage 2a: sample candidates from the SFT model and build DPO pairs.
policy_model: Qwen/Qwen3-1.7B
policy_adapter: outputs/sft
input_file: data/processed/train.jsonl
output_file: data/preferences/dpo_train.jsonl
num_listings: 500
num_candidates: 4
temperature: 0.9
max_new_tokens: 32
batch_size: 4
include_original_title: true
judge:
  model: claude-haiku-5-5
  max_workers: 8
seed: 42
