name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (CPU-only torch keeps CI fast)
        run: |
          uv sync --locked
          uv pip install --reinstall torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy
      - name: Unit tests
        run: uv run --no-sync pytest -m "not slow"
      - name: End-to-end smoke test (tiny model, offline)
        run: uv run --no-sync pytest -m slow
